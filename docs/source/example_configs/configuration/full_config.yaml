---
input:
  loaders:
    image: pivot
    classification: pivot
  sensors:
    one:
      image:
        bands:
          b0:
            path: tutorials/data_gizeh_small/img1.tif
            band: 0
          b1:
            path: tutorials/data_gizeh_small/color1.tif
            band: 0
          b2:
            path: tutorials/data_gizeh_small/color1.tif
            band: 1
          b3:
            path: tutorials/data_gizeh_small/color1.tif
            band: 2
          b4:
            path: tutorials/data_gizeh_small/color1.tif
            band: 3
        sensor_type: PHR
        no_data: 0
      classification:
        path: tutorials/data_gizeh_small/classif1.tif
        values:
        - 1
        - 2
        - 3
        - 4
      geomodel:
        path: tutorials/data_gizeh_small/img1.tif
        model_type: RPC
      mask: null
    two:
      image:
        bands:
          b0:
            path: tutorials/data_gizeh_small/img2.tif
            band: 0
        sensor_type: PHR
        no_data: 0
      classification:
        path: tutorials/data_gizeh_small/classif2.tif
        values:
        - 1
        - 2
        - 3
        - 4
      geomodel:
        path: tutorials/data_gizeh_small/img2.tif
        model_type: RPC
      mask: null
      edges:
        edges_mask: null
        normals: null
        depth_map: null
        tile_id: null
  filling:
    fill_with_geoid:
    - 1
    interpolate_from_borders: null
    fill_with_endogenous_dem: null
    fill_with_exogenous_dem: null
    interpolation: null
  initial_elevation:
    dem: tutorials/data_gizeh_small/srtm_dir/N29E031_KHEOPS.tif
    geoid: cars/conf/geoid/egm96.grd
  roi: null
  ignore_roi_during_a_priori: false
  dsm_to_fill: null
  pairing:
  - - one
    - two
  land_cover_map: global_land_cover_map.tif
  classification_to_configuration_mapping: config_mapping.json
  input_dtm: null
  scaling_coeff: null
output:
  directory: tutorials/data_gizeh_small/outresults
  auxiliary:
    performance_map:
    - 0
    - 0.968
    - 1.13375
    - 1.295
    - 1.604
    - 2.423
    - 3.428
    weights: true
    classification:
      1: 1
      2: 2
      3: 3
      4: 4
    contributing_pair: true
    ambiguity: true
    edges: false
    image:
    - b1
    - b2
    - b3
    - b4
    filling:
      1: no_edition
      2: fill_with_exogenous_dem
      3: interpolation
      4: fill_with_endogenous_dem
      5: interpolate_from_borders
      6: fill_with_geoid
      7: other
  product_level:
  - dsm
  epsg: 32636
  resolution:
    value:
    - 0.6
    - 0.6
    unit: meter
  product_format:
    point_cloud:
    - laz
  geoid: true
  save_by_pair: false
orchestrator:
  mode: multiprocessing
  mp_mode: forkserver
  max_ram_per_worker: 2000
  nb_workers: 4
  task_timeout: 600
  max_tasks_per_worker: 10
  dump_to_disk: true
  per_job_timeout: 600
  factorize_tasks: true
subsampling:
  advanced:
    save_intermediate_data: true
    resolutions:
    - 4
    - 1
    min_image_size: 80
  applications:
    sensors_subsampling:
      method: rasterio
      tile_size: 10000
      interpolator_image: bilinear
      interpolator_classif: nearest
      interpolator_mask: nearest
pipeline:
  subsampling: true
  surface_modeling: true
  tie_points: true
  formatting: true
  filling: true
  merging: false
tie_points:
  applications:
    '4':
      grid_generation:
        save_intermediate_data: true
        method: epipolar
        epi_step: 30
        find_optimal_altitude: true
      resampling:
        save_intermediate_data: true
        method: bicubic
        strip_height: 60
        interpolator_image: bicubic
        interpolator_classif: nearest
        interpolator_mask: nearest
        interpolators_edges:
          edges_mask: nearest
          depth_map: nearest
          normals: nearest
          tile_id: nearest
        step: 500
      sparse_matching:
        application: basic
        decimation_factor: 100
        elevation_delta_lower_bound: -500
        elevation_delta_upper_bound: 1000
        tile_margin: 10
        epipolar_error_upper_bound: auto
        epipolar_error_maximum_bias: auto
        epipolar_error_estimation: auto
        minimum_nb_matches: 90
        save_intermediate_data: true
        disparity_bounds_estimation:
          activated: true
          percentile: 1
          lower_margin: 500
          upper_margin: 1000
        method: sift
        sift_matching_threshold: 0.7
        sift_n_octave: 8
        sift_n_scale_per_octave: 3
        sift_peak_threshold: 4.0
        sift_edge_threshold: 10.0
        sift_magnification: 7.0
        sift_window_size: 2
        sift_back_matching: true
        used_band: b0
        tile_width: 5000
        tile_height: 60
