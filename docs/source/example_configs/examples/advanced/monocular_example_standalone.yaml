pipeline: monocular

input:
  sensors:
    img1: /path_to_img1
    img2: /path_to_img2

# options for monocular, can be entirely omitted if you want to use the default settings
monocular:
  advanced:
    right_image_monocular: true # if true, will run monocular on the right images as well
  applications:
    depth_map_generation:
      method: moge2 # the only supported method for now
      model: Ruicheng/moge-2-vitl-normal # the model weights to use for depth map generation
      save_intermediate_data: true # whether to save intermediate data (e.g. depth maps, normal maps) to the output directory
      edge_threshold: 0.7 # the threshold for monocular, lower values will result in more edges being detected

output:
  directory: out_monocular/
